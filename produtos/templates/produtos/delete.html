{% extends "produtos/base_produtos.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0 text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Excluir Produto</h2>
</div>

<div class="card p-4 shadow-sm" style="background-color: var(--cor-fundo-box); border: 2px solid var(--cor-borda) !important; border-radius: 12px;">
    
    <p class="fs-4 mb-4" style="color: var(--cor-texto);">
        Tem certeza que deseja excluir o produto <strong>{{ produto.nome }}</strong>? Essa ação não poderá ser desfeita.
    </p>

    <form method="post" aria-label="Formulário de exclusão de produto">
        {% csrf_token %}
        
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger btn-lg fw-bold px-4" tabindex="0">
                <i class="bi bi-trash3-fill me-2"></i>Sim, excluir
            </button>
            <a href="{% url 'lista_produtos' %}" class="btn btn-outline-secondary btn-lg fw-bold px-4" tabindex="0">
                <i class="bi bi-x-circle me-2"></i>Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
