{% extends "produtos/base_produtos.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0"><i class="bi bi-pencil-square me-2"></i>Editar Produto</h2>
</div>

<div class="card p-4 shadow-sm" style="background-color: var(--cor-fundo-box); border: 2px solid var(--cor-borda) !important; border-radius: 12px;">
    
    <style>
        form p {
            margin-bottom: 20px;
        }
        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--cor-texto);
        }
        form input, form select, form textarea {
            display: block;
            width: 100%;
            padding: 10px 15px;
            font-size: 1.1rem;
            font-family: inherit;
            color: var(--cor-texto);
            background-color: var(--cor-fundo-box);
            background-clip: padding-box;
            border: 2px solid var(--cor-borda);
            border-radius: 8px;
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }
        form input:focus, form select:focus, form textarea:focus {
            color: var(--cor-texto);
            background-color: var(--cor-fundo-box);
            border-color: var(--foco-teclado);
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        /* Ajuste do leitor de tela / modo de alto contraste para os inputs */
        body.alto-contraste form input, body.alto-contraste form select {
            border-color: #ffff00 !important;
            color: #ffff00 !important;
            background: #000000 !important;
        }
    </style>

    <form method="post" aria-label="Formulário de edição de produto">
        {% csrf_token %}
        
        {{ form.as_p }}

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg fw-bold px-4" tabindex="0">
                <i class="bi bi-check-circle me-2"></i>Salvar Alterações
            </button>
            <a href="{% url 'lista_produtos' %}" class="btn btn-outline-secondary btn-lg fw-bold px-4" tabindex="0">
                <i class="bi bi-x-circle me-2"></i>Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
