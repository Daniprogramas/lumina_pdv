{% extends "usuarios/base_usuarios.html" %}

{% block title %}Login - Lumina PDV{% endblock %}

{% block content %}
<style>
    .login-card {
        background-color: var(--cor-fundo-box);
        border: 2px solid var(--cor-borda);
        border-radius: 12px;
        padding: 40px 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        transition: 0.3s;
    }
    body.alto-contraste .login-card {
        box-shadow: none;
        border-width: 3px;
    }
    .form-label-pdv {
        font-weight: 800;
        color: var(--cor-texto);
        margin-bottom: 8px;
        font-size: 1.1rem;
        display: block;
    }
    .input-pdv {
        background-color: var(--cor-fundo-body);
        color: var(--cor-texto);
        border: 2px solid var(--cor-borda);
        border-radius: 8px;
        padding: 14px 15px;
        font-size: 1.1rem;
        width: 100%;
        transition: 0.2s;
    }
    .btn-pdv {
        background-color: var(--cor-primaria);
        color: var(--cor-fundo-box);
        font-weight: 800;
        font-size: 1.2rem;
        padding: 14px;
        border-radius: 8px;
        border: 2px solid var(--cor-primaria);
        transition: 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn-pdv:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }
    body.alto-contraste .btn-pdv {
        background-color: var(--cor-texto);
        color: var(--cor-fundo-box);
        border-color: var(--cor-texto);
    }
    .icon-login {
        font-size: 3.5rem;
        color: var(--cor-primaria);
        margin-bottom: 10px;
    }
</style>

<div class="row justify-content-center align-items-center" style="min-height: 55vh;">
    <div class="col-md-6 col-lg-5">
        <div class="login-card text-center" id="bloco-login">
            
            <i class="bi bi-person-bounding-box icon-login" aria-hidden="true"></i>
            <h2 class="mb-4" style="font-weight: 800;">ACESSO AO SISTEMA</h2>

            {% if messages %}
              <div class="mt-3 text-start">
                {% for message in messages %}
                  <div class="alert alert-{{ message.tags }} fw-bold" role="alert" style="border: 2px solid currentColor;">
                      <i class="bi bi-info-circle-fill me-2"></i> {{ message }}
                  </div>
                {% endfor %}
              </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" class="text-start mt-4">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="username" class="form-label-pdv">
                        <i class="bi bi-person-fill me-2" aria-hidden="true"></i>USUÁRIO
                    </label>
                    <input type="text" name="username" id="username" class="input-pdv" placeholder="Digite seu login" required aria-label="Usuário">
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label-pdv">
                        <i class="bi bi-lock-fill me-2" aria-hidden="true"></i>SENHA
                    </label>
                    <input type="password" name="password" id="password" class="input-pdv" placeholder="Digite sua senha" required aria-label="Senha">
                </div>
                
                <button type="submit" class="btn-pdv w-100 mt-3">
                    ENTRAR (ENTER) <i class="bi bi-box-arrow-in-right ms-2" aria-hidden="true"></i>
                </button>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
